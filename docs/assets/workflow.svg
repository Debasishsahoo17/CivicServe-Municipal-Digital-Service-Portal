<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="330" viewBox="0 0 1160 330" role="img" aria-label="CivicServe workflow: citizen submits request, administrator assigns case, officer reviews, then approves, rejects, or requests further information">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#222640"/><stop offset="1" stop-color="#35336f"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0e132a" flood-opacity=".15"/></filter><marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0 0 6 3 0 6" fill="none" stroke="#a7a1ff" stroke-width="1.6"/></marker></defs>
<rect width="1160" height="330" fill="url(#bg)" rx="22"/><text x="38" y="46" font-family="Arial,sans-serif" font-size="24" fill="#fff" font-weight="700">A transparent journey from request to resolution</text><text x="38" y="75" font-family="Arial,sans-serif" font-size="13" fill="#bfc1ec">Every step has access rules, notifications, and an audit trail.</text>
<g font-family="Arial,sans-serif" filter="url(#s)">
<rect x="37" y="122" width="245" height="120" rx="14" fill="#fff"/><rect x="37" y="122" width="245" height="7" rx="3" fill="#7c72eb"/><circle cx="67" cy="160" r="14" fill="#eeeaff"/><text x="67" y="165" text-anchor="middle" font-size="14" font-weight="700" fill="#675de0">1</text><text x="91" y="165" font-size="17" font-weight="700" fill="#20243b">Citizen</text><text x="59" y="192" font-size="12" fill="#666d85">Select a service &amp; submit</text><text x="59" y="212" font-size="12" fill="#666d85">an online application</text>
<rect x="329" y="122" width="245" height="120" rx="14" fill="#fff"/><rect x="329" y="122" width="245" height="7" rx="3" fill="#7c72eb"/><circle cx="359" cy="160" r="14" fill="#eeeaff"/><text x="359" y="165" text-anchor="middle" font-size="14" font-weight="700" fill="#675de0">2</text><text x="383" y="165" font-size="17" font-weight="700" fill="#20243b">Administrator</text><text x="351" y="192" font-size="12" fill="#666d85">Review queue &amp; assign</text><text x="351" y="212" font-size="12" fill="#666d85">to a municipal officer</text>
<rect x="621" y="122" width="245" height="120" rx="14" fill="#fff"/><rect x="621" y="122" width="245" height="7" rx="3" fill="#7c72eb"/><circle cx="651" cy="160" r="14" fill="#eeeaff"/><text x="651" y="165" text-anchor="middle" font-size="14" font-weight="700" fill="#675de0">3</text><text x="675" y="165" font-size="17" font-weight="700" fill="#20243b">Officer</text><text x="643" y="192" font-size="12" fill="#666d85">Review evidence, request</text><text x="643" y="212" font-size="12" fill="#666d85">information or decide</text>
<rect x="913" y="122" width="210" height="120" rx="14" fill="#fff"/><rect x="913" y="122" width="210" height="7" rx="3" fill="#52b78c"/><circle cx="943" cy="160" r="14" fill="#e5f7ed"/><path d="m936 160 5 5 9-10" fill="none" stroke="#198a5c" stroke-width="2.4" stroke-linecap="round"/><text x="967" y="165" font-size="17" font-weight="700" fill="#20243b">Decision</text><text x="935" y="192" font-size="12" fill="#666d85">Citizen sees status</text><text x="935" y="212" font-size="12" fill="#666d85">and timeline updates</text>
</g>
<g stroke="#aaa3ff" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M284 181h41"/><path d="M576 181h41"/><path d="M868 181h40"/></g><text x="580" y="286" font-family="Arial,sans-serif" font-size="12" fill="#bfc1ec" text-anchor="middle">If more details are needed, the citizen responds and the case returns to officer review.</text>
</svg>
